<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14213d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Сверка">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Сверка товаров из Китая</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" crossorigin="anonymous"></script>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#14213d;--mute:#6b7690;--line:#dfe5ee;--ok:#16a06a;--okbg:#e5f6ee;--acc:#3a56d4;--photo:#f4f6fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#182032;--ink:#eaf0ff;--mute:#93a0bd;--line:#273250;--ok:#34d399;--okbg:#12342b;--acc:#8ea2ff;--photo:#222c44;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#182032;--ink:#eaf0ff;--mute:#93a0bd;--line:#273250;--ok:#34d399;--okbg:#12342b;--acc:#8ea2ff;--photo:#222c44;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1100px;margin:0 auto;padding:20px 14px 90px}
h1{font-size:clamp(26px,5vw,38px);line-height:1.1;margin:6px 0 4px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 18px;font-size:15px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:14px}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-size:clamp(44px,10vw,64px);line-height:1;font-weight:800;color:var(--ok);letter-spacing:-.03em}
.big span{font-size:20px;color:var(--mute);font-weight:500}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .35s ease}
.stats{display:flex;gap:22px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.stats b{display:block;font-size:20px;color:var(--ink);font-weight:700}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0;margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;gap:2px}
.tabs button{border:0;background:none;color:var(--mute);font:600 14px inherit;font-family:inherit;padding:9px 13px;border-radius:11px;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px 'Golos Text',system-ui,sans-serif;padding:11px 15px;border-radius:13px;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri[disabled]{opacity:.6}
.btn.warn{color:#d23b3b;border-color:#d23b3b}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,background .2s}
.card.ok{border-color:var(--ok);background:var(--okbg)}
.card.hide{display:none}
.ph{position:relative;aspect-ratio:1/1;background:var(--photo);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ph img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.num{position:absolute;left:8px;top:8px;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px;min-width:28px;height:28px;border-radius:9px;display:grid;place-items:center;padding:0 7px}
.ft{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.kg{flex:1;min-width:0;display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 10px}
.kg input{width:100%;min-width:0;border:0;background:none;color:var(--ink);font:700 17px 'Golos Text',system-ui,sans-serif;padding:11px 0;outline:none}
.kg span{color:var(--mute);font-size:14px;font-weight:600}
.kg:focus-within{border-color:var(--acc)}
.chk{grid-column:1/-1;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font:700 15px 'Golos Text',system-ui,sans-serif;transition:all .15s}
.chk svg{width:22px;height:22px;opacity:.35}.card.ok .chk svg{opacity:1}
.card.ok .chk{background:var(--ok);border-color:var(--ok);color:#fff}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Сверка товаров</h1>
  <p class="sub">Посылка из Китая: впишите вес и отметьте, что пришло</p>
  <section class="hero">
    <div class="big"><b id="cnt">0</b><span id="of">из 0 пришло</span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="stats">
      <div><b id="qAll">0</b>всего штук</div>
      <div><b id="wAll">0</b>общий вес, кг</div>
      <div><b id="wOk">0</b>вес пришедших, кг</div>
      <div><b id="left">0</b>ещё ждём</div>
    </div>
  </section>
  <div class="tools">
    <div class="tabs" id="tabs">
      <button data-f="all" class="on">Все</button><button data-f="no">Не пришли</button><button data-f="yes">Пришли</button>
    </div>
    <div class="sp"></div>
    <button class="btn warn" id="reset">Сбросить</button>
    <button class="btn pri" id="exp">Скачать Excel</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div class="toast" id="toast"></div>

const KEY='sverka_china_v1', N=PHOTOS.length;
let st={kg:Array(N).fill(''),qty:Array(N).fill('1'),ok:Array(N).fill(false)}, filter='all';
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.kg&&s.kg.length===N){st=s;if(!st.qty)st.qty=Array(N).fill('1')}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const $=id=>document.getElementById(id);
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:0};
const fmt=x=>(Math.round(x*100)/100).toString().replace('.',',');
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>';
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
const cards=[];
PHOTOS.forEach((p,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="ph"><img alt="Товар ${i+1}" src="${p.src}"><span class="num">${i+1}</span></div>
  <div class="ft"><label class="kg"><input inputmode="numeric" placeholder="1" aria-label="Количество товара ${i+1}, шт"><span>шт</span></label>
  <label class="kg"><input inputmode="decimal" placeholder="0" aria-label="Вес товара ${i+1}, кг"><span>кг</span></label>
  <button class="chk" aria-label="Пришло: товар ${i+1}">${CHECK}<span>Пришло</span></button></div>`;
  const [qi,inp]=c.querySelectorAll('input'),btn=c.querySelector('.chk');qi.value=st.qty[i];qi.addEventListener('input',()=>{st.qty[i]=qi.value;save();stats()});
  inp.value=st.kg[i];
  inp.addEventListener('input',()=>{st.kg[i]=inp.value;save();stats()});
  const tog=()=>{st.ok[i]=!st.ok[i];save();paint(i);stats();apply()};
  btn.addEventListener('click',tog);c.querySelector('.ph').addEventListener('click',tog);
  $('grid').appendChild(c);cards.push(c);
});
function paint(i){cards[i].classList.toggle('ok',st.ok[i]);cards[i].querySelector('.chk').setAttribute('aria-pressed',st.ok[i])}
function stats(){
  const k=st.ok.filter(Boolean).length;
  $('cnt').textContent=k;$('of').textContent=`из ${N} пришло`;
  $('prog').style.width=(N?k/N*100:0)+'%';
  $('qAll').textContent=st.qty.reduce((a,v)=>a+(v===''?1:Math.round(num(v))),0);$('wAll').textContent=fmt(st.kg.reduce((a,v)=>a+num(v),0));
  $('wOk').textContent=fmt(st.kg.reduce((a,v,i)=>a+(st.ok[i]?num(v):0),0));
  $('left').textContent=N-k;
}
function apply(){
  let shown=0;
  cards.forEach((c,i)=>{const h=(filter==='yes'&&!st.ok[i])||(filter==='no'&&st.ok[i]);c.classList.toggle('hide',h);if(!h)shown++});
  let e=document.querySelector('.empty');if(e)e.remove();
  if(!shown){e=document.createElement('div');e.className='empty';e.textContent=filter==='yes'?'Пока ничего не отмечено':'Всё пришло — отлично!';$('grid').appendChild(e)}
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;
  [...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));apply()});
let rt;$('reset').addEventListener('click',()=>{
  const b=$('reset');
  if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Точно сбросить?';rt=setTimeout(()=>{delete b.dataset.arm;b.textContent='Сбросить'},3000);return}
  clearTimeout(rt);delete b.dataset.arm;b.textContent='Сбросить';
  st={kg:Array(N).fill(''),qty:Array(N).fill('1'),ok:Array(N).fill(false)};save();
  cards.forEach((c,i)=>{const q=c.querySelectorAll('input');q[0].value='1';q[1].value='';paint(i)});stats();apply();toast('Всё сброшено')});
stats();cards.forEach((_,i)=>paint(i));apply();

let dl=null;
(async()=>{try{if(typeof claude!=='undefined')dl=await claude.use('downloads')}catch(e){}})();
async function saveFile(name,buf){
  if(dl){await dl.save({filename:name,data:buf});return}
  const MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const blob=new Blob([buf],{type:MIME});
  const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios&&navigator.canShare){
    const file=new File([blob],name,{type:MIME});
    if(navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e&&e.name==='AbortError')return}}
  }
  const u=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

$('exp').addEventListener('click',async()=>{
  const b=$('exp');
  if(typeof ExcelJS==='undefined'){toast('Для экспорта в Excel нужен интернет');return}
  b.disabled=true;b.textContent='Готовлю…';
  try{
    const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Сверка',{views:[{state:'frozen',ySplit:7,showGridLines:false}]});
    const F='Arial',NAVY='FF14213D',thin={style:'thin',color:{argb:'FFD5DBE5'}},bd={top:thin,left:thin,bottom:thin,right:thin};
    const OKT='✔ Пришло',NOT='Не пришло';
    ws.columns=[{width:7},{width:27},{width:10},{width:12},{width:18}];
    const R0=8,R1=7+N,ctr={horizontal:'center',vertical:'middle'};
    const q=i=>st.qty[i]===''?1:Math.round(num(st.qty[i]));
    ws.mergeCells('A1:E1');const a1=ws.getCell('A1');a1.value='Сверка товаров из Китая';
    a1.font={name:F,size:18,bold:true,color:{argb:NAVY}};a1.alignment={vertical:'middle'};ws.getRow(1).height=36;
    ws.mergeCells('A2:E2');const a2=ws.getCell('A2');a2.value='Дата: '+new Date().toLocaleDateString('ru-RU');
    a2.font={name:F,size:10,color:{argb:'FF6B7690'}};
    const k=st.ok.filter(Boolean).length,qs=st.qty.reduce((a,v,i)=>a+q(i),0),wAll=st.kg.reduce((a,v)=>a+num(v),0),wOk=st.kg.reduce((a,v,i)=>a+(st.ok[i]?num(v):0),0);
    const sum=[['Пришло',`COUNTIF(E${R0}:E${R1},"${OKT}")&" из "&COUNTA(A${R0}:A${R1})`,k+' из '+N],
      ['Всего штук',`SUM(C${R0}:C${R1})`,qs],['Общий вес, кг',`SUM(D${R0}:D${R1})`,wAll],['Вес пришедших, кг',`SUMIF(E${R0}:E${R1},"${OKT}",D${R0}:D${R1})`,wOk]];
    sum.forEach((s,j)=>{const r=3+j;ws.mergeCells(`A${r}:B${r}`);ws.mergeCells(`C${r}:E${r}`);
      const l=ws.getCell(`A${r}`),v=ws.getCell(`C${r}`);l.value=s[0];v.value={formula:s[1],result:s[2]};
      l.font={name:F,size:11,color:{argb:'FF6B7690'}};v.font={name:F,size:12,bold:true,color:{argb:NAVY}};
      v.alignment={horizontal:'left'};if(j>1)v.numFmt='0.00'});
    const hr=ws.getRow(7);hr.height=26;
    ['№','Фото','Кол-во','Кг','Пришло'].forEach((h,j)=>{const c=hr.getCell(j+1);c.value=h;
      c.font={name:F,bold:true,size:12,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}};c.alignment=ctr;c.border=bd});
    PHOTOS.forEach((p,i)=>{
      const r=R0+i,row=ws.getRow(r);row.height=112;
      const vals=[i+1,null,q(i),st.kg[i]===''?null:num(st.kg[i]),st.ok[i]?OKT:NOT];
      vals.forEach((v,j)=>{const c=row.getCell(j+1);if(v!==null)c.value=v;c.border=bd;c.alignment=ctr;
        c.font={name:F,size:j===4?12:13,bold:j===4||j===0,color:{argb:j===4&&!st.ok[i]?'FF8A94A8':'FF14213D'}}});
      row.getCell(3).numFmt='0';row.getCell(4).numFmt='0.00';
      row.getCell(5).dataValidation={type:'list',allowBlank:false,formulae:[`"${OKT},${NOT}"`]};
      const id=wb.addImage({base64:p.src,extension:'jpeg'});
      const sc=Math.min(165/p.w,135/p.h),w=p.w*sc,h=p.h*sc,cw=27*7+5,rh=112*4/3;
      const c0=1+(cw-w)/2/cw,r0=r-1+(rh-h)/2/rh;ws.addImage(id,{tl:{col:c0,row:r0},br:{col:c0+w/cw,row:r0+h/rh},editAs:'oneCell'});
    });
    ws.addConditionalFormatting({ref:`A${R0}:E${R1}`,rules:[{type:'expression',priority:1,formulae:[`$E${R0}="${OKT}"`],
      style:{font:{bold:true,color:{argb:'FF0E7A50'}},fill:{type:'pattern',pattern:'solid',bgColor:{argb:'FFDDF3E6'}}}}]});
    const buf=await wb.xlsx.writeBuffer();
    await saveFile('sverka_china.xlsx',buf);
    toast('Файл сохранён');
  }catch(e){if(!e||e.code!=='declined')toast('Не удалось сохранить файл')}
  b.disabled=false;b.textContent='Скачать Excel';
});
</script>
